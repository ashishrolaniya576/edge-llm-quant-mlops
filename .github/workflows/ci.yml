name: CI/CD Pipeline - Edge LLM Quant MLOps

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Black Formatter Check
        run: |
          black --check --diff .

      - name: Run isort Import Order Check
        run: |
          isort --check-only --diff .

  test-suite:
    name: Automated Unit & API Tests
    runs-on: ubuntu-latest
    needs: [lint-and-code-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi uvicorn pydantic httpx psutil pyyaml

      - name: Execute Pytest Suite
        run: |
          pytest tests/ -v --tb=short

  mock-inference-and-benchmarking:
    name: Mock Edge Inference & Benchmark Verification
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Runtime Requirements
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic httpx psutil pyyaml rich

      - name: Verify Synthetic Telemetry Generation
        run: |
          python src/data_loader.py --num-samples 50 --output data/ci_sample_logs.jsonl
          test -f data/ci_sample_logs.jsonl

      - name: Execute Edge Benchmark Harness (Simulated Edge)
        run: |
          python src/benchmark.py --dry-run --output-json benchmark_results.json
          test -f benchmark_results.json

      - name: Validate Benchmark JSON Output
        run: |
          python -c "
          import json
          with open('benchmark_results.json') as f:
              data = json.load(f)
          assert 'results' in data and len(data['results']) == 3
          print('Benchmark artifact verified successfully.')
          "

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 14
